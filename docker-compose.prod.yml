# Produção: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    image: milhasx-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://milheiro:${POSTGRES_PASSWORD}@db:5432/milheiro?schema=public
      REDIS_URL: redis://redis:6379
      # o site não conecta no Telegram: pede ao gateway (uma conexão por sessão)
      TG_GATEWAY_URL: http://tg-gateway:3200
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tg-gateway:
        condition: service_started

  # Chat Balcões em tempo real: o único processo conectado no Telegram (eventos, recuperação e os pedidos do site).
  # Mesma imagem do app; sem porta publicada (só a rede interna). Deploy: pare o app antes de subir o gateway, para
  # nunca haver duas conexões com a mesma sessão.
  tg-gateway:
    image: milhasx-app:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://milheiro:${POSTGRES_PASSWORD}@db:5432/milheiro?schema=public
      REDIS_URL: redis://redis:6379
      TG_GATEWAY_URL: ""
      NODE_ENV: production
    command: ["npx", "tsx", "src/gateway/main.ts"]
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
