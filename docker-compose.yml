services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: milheiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milheiro_dev}
      POSTGRES_DB: milheiro
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - milheiro_pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milheiro"]
      interval: 5s
      retries: 10
  # Redis do Chat Balcões em tempo real (Pub/Sub dos eventos do Telegram). Só memória: nada a guardar em disco,
  # o que importa fica no Postgres. Exposto só na máquina (desenvolvimento e testes).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  milheiro_pg:
